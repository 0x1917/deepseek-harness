# Issue chooser. These two forms cover this repository's job: the image, its
# entrypoint, and the CI chain. Reports that belong elsewhere are routed by the
# links below before they land here.

blank_issues_enabled: true

contact_links:
  - name: Unraid template issue (templates repository)
    url: https://github.com/0x1917/unraid-templates/issues
    about: The template, its fields, its defaults, and the artwork are maintained in the templates repository, not here.
  - name: App bug or app feature (upstream Discussions)
    url: https://github.com/deepseek-ai/deepseek-harness/discussions
    about: The agent, models, tools, sessions, plugins and the web UI belong to DeepSeek Harness itself. Upstream takes reports in Discussions; its issue tracker is closed.
  - name: Upstream documentation
    url: https://deepseek-harness.github.io/deepseek-harness/
    about: Configuration, providers, plugins and the Web UI guide, maintained by the upstream project.
  - name: Image tags on Docker Hub
    url: https://hub.docker.com/r/0x1917/deepseek-harness/tags
    about: Every published version, and what :latest points at.
